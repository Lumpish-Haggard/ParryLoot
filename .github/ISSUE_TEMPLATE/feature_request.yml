name: Feature idea
description: Suggest an improvement to Parry Loot or its INI options.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the gameplay or configuration improvement.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details & alternatives
      description: How you expect it to behave alongside vanilla consumables and other mods.
