[ParryLoot]
; Master toggle (true/false or 1/0)
enabled = true

; Buff duration in seconds after a successful parry (must be long enough
; to cover the riposte animation so it is active when the enemy dies).
; 0.5 to 170: it stays shorter than a real Silver-Pickled Fowl Foot's 180 s,
; which is how the mod tells the two apart.
duration = 15.0

; Item Discovery bonus granted while the parry buff is active.
; Default: 25 (+25 Item Discovery: vanilla-friendly, half a Silver-Pickled Fowl Foot).
; Set to 50 to match a full Silver-Pickled Fowl Foot.
item_discovery_bonus = 25

; Triggers
melee_parry = true
; Spell / projectile parries (Carian Retaliation, Thops's Barrier). Off by default:
; the game event it listens to also fires when a parry skill hits nothing, so with
; it on, a parry at the air gives the buff too.
spell_parry = false

; Vanilla SpEffect ID used for the icon and ERBuffTimer countdown.
; 3970 = Silver-Pickled Fowl Foot (Item Discovery icon). Leave it at 3970:
; item_discovery_bonus is set relative to that effect's own +50.
sp_effect_id = 3970

; Write mods\ParryLoot.log
log = true
